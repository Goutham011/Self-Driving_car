name: CI

on:
  push:
    branches: [main, v2-rewrite]
  pull_request:
    branches: [main]

jobs:
  # Fast unit suite — no torch, no weight downloads. Asset-backed tests
  # auto-skip when their fixtures are absent, so this stays <1 min.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install slim dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.26,<3" \
            "opencv-python>=4.8" \
            "scikit-learn>=1.3" \
            "scikit-image>=0.21" \
            "scipy>=1.11" \
            "matplotlib>=3.7" \
            "pytest>=7.4"

      - name: Run unit tests
        run: pytest tests/ -v

  # Full smoke of every pipeline — downloads SSD/YOLO weights (cached),
  # runs the real detectors on committed sample images, and uploads the
  # annotated outputs as PR artifacts.
  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            data/weights
            data/ssd/mobilenet_iter_73000.caffemodel
          key: model-weights-v1

      - name: Download SSD weights
        run: python -c "from SSD import get_SSD_model; get_SSD_model()"

      - name: Download YOLO weights
        run: python -c "from detect import ensure_weights; ensure_weights('data/weights/yolov3-tiny.weights')"

      - name: Run full test suite (incl. asset tests)
        run: pytest tests/ -v

      - name: Lane pipeline smoke
        run: |
          python main.py --input data/lane/test_images/solidYellowLeft.jpg \
            --output out/ci/lane --no-display

      - name: SSD pipeline smoke
        run: |
          python main_ssd.py --input data/ssd/images/000000097679.jpg \
            --output out/ci/ssd --no-display

      - name: YOLO pipeline smoke
        run: |
          python detect.py --source data/traffic_light \
            --output out/ci/yolo --no-tts

      - name: Upload annotated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: out/ci/
          retention-days: 14
